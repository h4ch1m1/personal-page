<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="h4ch1m1's personal GitHub Pages entry, pointing to Neuro Notes: a bilingual notebook for computational neuroscience and brain-inspired intelligence." />
    <meta name="author" content="h4ch1m1" />
    <meta name="theme-color" content="#246b62" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="h4ch1m1 | Neuro Notes" />
    <meta property="og:description" content="Personal GitHub Pages entry for Neuro Notes, a bilingual learning notebook on computational neuroscience and brain-inspired intelligence." />
    <meta property="og:url" content="https://h4ch1m1.github.io/" />
    <meta http-equiv="refresh" content="3; url=https://h4ch1m1.github.io/neuro-notes/" />
    <link rel="canonical" href="https://h4ch1m1.github.io/" />
    <title>h4ch1m1 | GitHub Pages</title>
    <style>
      :root {
        --bg: #f7f6f0;
        --text: #20231f;
        --muted: #62685f;
        --accent: #246b62;
        --line: #dedbd0;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.6;
      }

      main {
        width: min(760px, calc(100% - 36px));
        padding: clamp(28px, 7vw, 64px);
        border: 1px solid var(--line);
        background: white;
        box-shadow: 0 18px 50px rgba(32, 35, 31, 0.1);
      }

      p {
        color: var(--muted);
      }

      h1 {
        margin: 0 0 12px;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(42px, 8vw, 78px);
        line-height: 1;
      }

      a {
        color: var(--accent);
        font-weight: 800;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 24px;
      }

      .button {
        display: inline-flex;
        min-height: 42px;
        align-items: center;
        justify-content: center;
        border: 1px solid var(--accent);
        background: var(--accent);
        color: white;
        padding: 10px 16px;
        text-decoration: none;
      }

      .button.secondary {
        border-color: var(--line);
        background: white;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <main>
      <p>h4ch1m1 · GitHub Pages</p>
      <h1>Neuro Notes</h1>
      <p>正在跳转到计算神经科学与类脑智能学习笔记网站。Redirecting to the computational neuroscience and brain-inspired intelligence notes site.</p>
      <div class="actions">
        <a class="button" href="https://h4ch1m1.github.io/neuro-notes/">Open Neuro Notes</a>
        <a class="button secondary" href="https://github.com/h4ch1m1">GitHub @h4ch1m1</a>
      </div>
    </main>
  </body>
</html>
